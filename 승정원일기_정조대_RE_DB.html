<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>승정원일기 Relation Explorer</title>

<!-- sql.js (SQLite in Browser) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>

<style>
body { font-family: Arial, sans-serif; margin: 20px; }
h1 { margin-bottom: 5px; }
table { border-collapse: collapse; width: 100%; margin-top: 10px; }
th, td { border: 1px solid #ddd; padding: 8px; }
th { background-color: #f2f2f2; text-align: left; }
label { margin-right: 10px; }
#results { margin-top: 20px; }
.filter-box { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; }
</style>

</head>
<body>

<h1>📜 승정원일기 Relation Explorer</h1>
<p>SQLite 기반 관계 추출 결과를 웹에서 바로 검색할 수 있습니다.</p>

<!-- ================================
     Filter UI
================================ -->
<div class="filter-box">
  <label>인물(Person): <input id="f_person" type="text" placeholder="예: 洪國榮"></label>
  <label>관직(Position): <input id="f_position" type="text" placeholder="예: 左承旨"></label>
  <label>관계 타입(Type):
    <select id="f_type">
      <option value="">전체</option>
      <option>임명</option>
      <option>근무</option>
      <option>재직</option>
      <option>이동</option>
      <option>추증</option>
      <option>전직</option>
      <option>사망</option>
    </select>
  </label>
  <label>동사(verb): <input id="f_verb" type="text" placeholder="예: 坐直, 相換"></label>
  <label>날짜(Date): <input id="f_date" type="text" placeholder="예: 정조 0년 4월 1일"></label>
  <button onclick="search()">검색</button>
</div>

<div id="results"></div>

<!-- ================================
     JS: SQLite Load + Query
================================ -->
<script>

let db = null;

// ① SQLite DB 파일 불러오기
async function initDB() {
    const SQL = await initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/${file}`
    });

    const response = await fetch("seungjeongwon_relations.db");
    const buffer = await response.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buffer));

    console.log("DB loaded!");
}

initDB();

// ② 검색 실행
function search() {
    if (!db) {
        alert("DB가 아직 로드되지 않았습니다.");
        return;
    }

    const person = document.getElementById("f_person").value.trim();
    const position = document.getElementById("f_position").value.trim();
    const type = document.getElementById("f_type").value.trim();
    const verb = document.getElementById("f_verb").value.trim();
    const date = document.getElementById("f_date").value.trim();

    let query = "SELECT * FROM relations WHERE 1=1";
    let params = [];

    if (person) { query += " AND person LIKE ?"; params.push("%" + person + "%"); }
    if (position) { query += " AND position LIKE ?"; params.push("%" + position + "%"); }
    if (type) { query += " AND type = ?"; params.push(type); }
    if (verb) { query += " AND verb LIKE ?"; params.push("%" + verb + "%"); }
    if (date) { query += " AND date LIKE ?"; params.push("%" + date + "%"); }

    query += " ORDER BY para_id ASC";

    const stmt = db.prepare(query);
    stmt.bind(params);

    let html = "<table><tr>" +
        "<th>날짜</th><th>인물</th><th>관직</th><th>관계</th>" +
        "<th>동사</th><th>원문보기</th></tr>";

    while (stmt.step()) {
        const row = stmt.getAsObject();

        const link = `https://sjw.history.go.kr/id/${row.para_id}`;

        html += `<tr>
          <td>${row.date || ""}</td>
          <td>${row.person || ""}</td>
          <td>${row.position || ""}</td>
          <td>${row.type || ""}</td>
          <td>${row.verb || ""}</td>
          <td><a href="${link}" target="_blank">원문보기</a></td>
        </tr>`;
    }

    html += "</table>";
    document.getElementById("results").innerHTML = html;
}

</script>

</body>
</html>
